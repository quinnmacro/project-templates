# 纯 Python 项目 CI 模板 — 2026 版
# 放到项目 .github/workflows/ci.yml
# 前置：用 uv 管理依赖，uv.lock 已入库

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format 检查
        run: uv run ruff format --check .

      - name: 类型检查
        run: uv run mypy src

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-groups --frozen

      - name: 测试 + 覆盖率
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: 上传覆盖率
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
