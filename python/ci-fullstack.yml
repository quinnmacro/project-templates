# FastAPI + 前端子目录（web/ 或 frontend/）全栈 CI 模板 — 2026 版
# 适用于 50-Structure / quinnpm 这类「Python 后端 + npm 前端」同仓项目
# 放到项目 .github/workflows/ci.yml
#
# 按需改三处：
#   WEB_DIR  前端目录名（默认 web）
#   PY_VER   Python 版本（默认 3.13，与 setup-python 无关，uv 会自动装）
#   删掉 browser-smoke 这个 job 就没 E2E

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_DIR: web
  PY_VER: "3.13"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ env.PY_VER }}
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json

      - name: 安装后端依赖
        run: uv sync --all-groups --frozen

      - name: 安装前端依赖
        run: npm --prefix ${{ env.WEB_DIR }} ci

      - name: 后端 lint + 类型
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src

      - name: 后端测试
        run: uv run pytest --cov=src --cov-report=term-missing

      - name: 前端 lint + 类型 + 构建
        run: |
          npm --prefix ${{ env.WEB_DIR }} run lint --if-present
          npm --prefix ${{ env.WEB_DIR }} run typecheck --if-present
          npm --prefix ${{ env.WEB_DIR }} run build

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ env.PY_VER }}
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json

      - run: uv sync --all-groups --frozen
      - run: npm --prefix ${{ env.WEB_DIR }} ci
      - run: uv run playwright install --with-deps chromium
      - name: E2E
        run: uv run pytest tests/e2e -m e2e
