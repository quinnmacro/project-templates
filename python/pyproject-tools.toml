# Python 项目工具配置模板
# 复制到项目的 pyproject.toml 末尾

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E4", "E7", "E9", "F"]
ignore = ["E722", "E402", "F402", "F841"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E722", "E402", "F402", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "E712"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["src/__main__.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
